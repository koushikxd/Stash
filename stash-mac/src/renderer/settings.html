<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>stash — Settings</title>
    <link rel="stylesheet" href="settings.css" />
  </head>
  <body>
    <main>
      <h1>stash</h1>
      <p class="hint">Links shared from your phone arrive here automatically, from anywhere — over an encrypted relay. No pairing, no network setup; both apps already share your private key.</p>

      <div id="status" class="status pending">Connecting to relay…</div>

      <details class="manual">
        <summary>Relay</summary>
        <div class="kv"><span>Server</span><code id="relayHost">—</code></div>
      </details>

      <section class="prefs">
        <label><input id="launch" type="checkbox" /> Launch at login</label>
      </section>
    </main>
    <script src="settings.js"></script>
  </body>
</html>
